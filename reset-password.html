<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Battle of Creations | Reset Password</title>
    <meta
      name="description"
      content="Reset your Battle of Creations browser game password."
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="landing" aria-label="Battle of Creations password reset">
      <div class="mist mist-one" aria-hidden="true"></div>
      <div class="mist mist-two" aria-hidden="true"></div>

      <section class="auth-stage" aria-labelledby="game-title">
        <div class="auth-grid">
          <article class="auth-card theme-green">
            <div class="corner corner-tl" aria-hidden="true"></div>
            <div class="corner corner-tr" aria-hidden="true"></div>
            <div class="corner corner-bl" aria-hidden="true"></div>
            <div class="corner corner-br" aria-hidden="true"></div>

            <header class="brand">
              <div class="crest" aria-hidden="true">
                <span></span>
              </div>
              <h1 id="game-title">
                <span>Battle</span>
                <small>of</small>
                <span>Creations</span>
              </h1>
              <p>Card Battle Game</p>
            </header>

            <div class="panel">
              <h2><span></span>Reset Password<span></span></h2>

              <form class="auth-form" data-form="reset">
                <label class="field">
                  <span>Email Address</span>
                  <span class="input-shell">
                    <span class="field-icon mail-icon" aria-hidden="true"></span>
                    <input type="email" name="email" autocomplete="email" placeholder="Enter your email address" required>
                  </span>
                </label>

                <label class="field">
                  <span>New Password</span>
                  <span class="input-shell">
                    <span class="field-icon lock-icon" aria-hidden="true"></span>
                    <input
                      type="password"
                      name="new-password"
                      autocomplete="new-password"
                      placeholder="Enter your new password"
                      minlength="6"
                      required
                    >
                    <button class="show-password" type="button" aria-label="Show new password" data-toggle-password></button>
                  </span>
                  <small>Minimum 6 characters</small>
                </label>

                <label class="field">
                  <span>Confirm New Password</span>
                  <span class="input-shell">
                    <span class="field-icon lock-icon" aria-hidden="true"></span>
                    <input
                      type="password"
                      name="confirm-password"
                      autocomplete="new-password"
                      placeholder="Confirm your new password"
                      minlength="6"
                      required
                    >
                    <button class="show-password" type="button" aria-label="Show confirmation password" data-toggle-password></button>
                  </span>
                </label>

                <button class="primary-button" type="submit">Reset Password</button>

                <a class="plain-link" href="index.html">Back to Login</a>
                <p class="form-message" role="status" aria-live="polite"></p>
              </form>
            </div>

            <div class="bottom-seal" aria-hidden="true"><span></span></div>
          </article>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
