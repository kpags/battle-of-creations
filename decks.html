<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Battle of Creations | Deck Constructor</title>
    <meta
      name="description"
      content="Build, customize, and perfect your ultimate deck."
    >
    <link rel="stylesheet" href="styles.css">
  </head>
  <body>
    <main class="creator-page deck-library-page" data-deck-library aria-label="Battle of Creations deck constructor">
      <aside class="creator-sidebar" aria-label="Game navigation">
        <a class="creator-brand" href="home.html" aria-label="Battle of Creations home">
          <span class="creator-brand-mark" aria-hidden="true"></span>
          <strong>Battle<br>of<br>Creations</strong>
          <small>Card Battle Game</small>
        </a>

        <nav class="creator-nav">
          <a class="creator-nav-item" href="home.html">
            <span class="mini-icon mini-home" aria-hidden="true"></span>
            <span>Home</span>
          </a>
          <button class="creator-nav-item" type="button" data-duel-now>
            <span class="mini-icon mini-duel" aria-hidden="true"></span>
            <span>Duel Now</span>
          </button>
          <a class="creator-nav-item" href="cards.html">
            <span class="mini-icon mini-card" aria-hidden="true"></span>
            <span>Card Creator</span>
          </a>
          <a class="creator-nav-item is-current" href="decks.html" aria-current="page">
            <span class="mini-icon mini-deck" aria-hidden="true"></span>
            <span>Deck Constructor</span>
          </a>
          <a class="creator-nav-item" href="lobby.html">
            <span class="mini-icon mini-lobby" aria-hidden="true"></span>
            <span>Lobby</span>
          </a>
          <a class="creator-nav-item" href="home.html#leaderboards">
            <span class="mini-icon mini-trophy" aria-hidden="true"></span>
            <span>Leaderboards</span>
          </a>
          <a class="creator-nav-item" href="home.html#rewards">
            <span class="mini-icon mini-chest" aria-hidden="true"></span>
            <span>Rewards</span>
          </a>
          <a class="creator-nav-item" href="index.html" data-logout>
            <span class="mini-icon mini-logout" aria-hidden="true"></span>
            <span>Logout</span>
          </a>
        </nav>
      </aside>

      <section class="card-library-shell">
        <header class="library-header">
          <div>
            <h1>Deck Constructor</h1>
            <p>Build, customize, and perfect your ultimate deck.</p>
          </div>
          <div class="library-actions">
            <a class="library-command command-create" href="deck-creator.html" data-create-deck>
              <span aria-hidden="true"></span>
              Create Deck
            </a>
            <button class="library-command command-delete" type="button" data-delete-mode>
              <span aria-hidden="true"></span>
              Delete Decks
            </button>
            <a class="library-command command-edit" href="#" hidden data-edit-deck>
              <span aria-hidden="true"></span>
              Edit Deck
            </a>
          </div>
        </header>

        <div class="library-layout">
          <section class="library-main-panel" aria-label="Your decks">
            <div class="library-filterbar deck-filterbar">
              <span class="library-count" data-deck-count>Loading decks...</span>
              <label class="library-search">
                <span class="search-icon" aria-hidden="true"></span>
                <input type="search" name="deckSearch" placeholder="Search decks..." data-deck-search>
              </label>
              <select name="deckSort" aria-label="Sort decks" data-deck-sort>
                <option value="newest">Sort By: Newest</option>
                <option value="oldest">Sort By: Oldest</option>
                <option value="name">Sort By: Name</option>
              </select>
            </div>

            <div class="bulk-delete-strip" hidden data-delete-strip>
              <strong data-delete-selected-count>0 selected</strong>
              <button type="button" data-confirm-delete>Delete Selected</button>
              <button type="button" data-cancel-delete>Cancel</button>
            </div>

            <div class="deck-table-grid" data-deck-grid aria-live="polite"></div>

            <nav class="library-pagination" aria-label="Deck pages" data-deck-pagination></nav>
          </section>

          <aside class="library-detail-panel deck-detail-panel" aria-label="Selected deck details" data-detail-pane></aside>
        </div>
      </section>

      <section class="delete-dialog" hidden data-delete-dialog aria-modal="true" role="dialog" aria-labelledby="deck-delete-dialog-title">
        <div class="delete-dialog-panel">
          <h2 id="deck-delete-dialog-title">Delete Selected Decks?</h2>
          <p data-delete-dialog-count></p>
          <div>
            <button type="button" data-cancel-confirm-delete>Cancel</button>
            <button type="button" data-run-delete>Delete Permanently</button>
          </div>
        </div>
      </section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
