services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    init: true
    restart: unless-stopped
    stop_grace_period: 20s
    ports:
      - "${APP_PORT:-5173}:5173"
    environment:
      NODE_ENV: production
      PORT: 5173
      PGHOST: postgres
      PGPORT: 5432
      PGDATABASE: ${POSTGRES_DB:-battle_of_creations}
      PGUSER: ${POSTGRES_USER:-boc}
      PGPASSWORD: ${POSTGRES_PASSWORD:-boc_dev_password}
      REDIS_URL: redis://redis:6379
      MEDIA_DIR: /app/data/media
      PG_POOL_MAX: ${PG_POOL_MAX:-20}
      API_CACHE_SECONDS: ${API_CACHE_SECONDS:-30}
      TASK_RETENTION_SECONDS: ${TASK_RETENTION_SECONDS:-3600}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - media_data:/app/data/media
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:5173/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-battle_of_creations}
      POSTGRES_USER: ${POSTGRES_USER:-boc}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-boc_dev_password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command:
      - redis-server
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --maxmemory-policy
      - noeviction
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  postgres_data:
  redis_data:
  media_data:
