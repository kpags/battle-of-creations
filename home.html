<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Battle of Creations | Home</title>
    <meta
      name="description"
      content="Battle of Creations home page with duel, card creator, deck, leaderboard, rewards, and logout actions."
    >
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" type="image/png" href="assets/game_picture.png">
  </head>
  <body>
    <main class="home" aria-label="Battle of Creations home">
      <div class="home-frame">
        <div class="home-corner home-corner-tl" aria-hidden="true"></div>
        <div class="home-corner home-corner-tr" aria-hidden="true"></div>
        <div class="home-corner home-corner-bl" aria-hidden="true"></div>
        <div class="home-corner home-corner-br" aria-hidden="true"></div>

        <div class="realm realm-fire" aria-hidden="true"></div>
        <div class="realm realm-sky" aria-hidden="true"></div>

        <header class="home-topbar" aria-label="Player status">
          <section class="player-card" aria-label="Current player">
            <div class="player-avatar" aria-hidden="true">
              <img class="player-avatar-img" src="assets/icons/user_icon.png" alt="" aria-hidden="true">
            </div>
            <div class="player-copy">
              <strong data-player-username>Player</strong>
              <span data-player-level>Level 1</span>
              <div class="xp-track" aria-label="Experience 4580 of 7200">
                <span data-player-xp-track style="width: 0%"></span>
              </div>
              <small data-player-xp>0 / 1000</small>
            </div>
          </section>

          <section class="coin-card" aria-label="Gold balance">
            <span class="coin-icon" aria-hidden="true"></span>
            <strong data-player-gold>0</strong>
          </section>
        </header>

        <section class="home-hero" aria-labelledby="home-title">
          <img class="home-logo-img" src="assets/game_picture.png" alt="Battle of Creations" aria-hidden="true">
          <h1 id="home-title">
            <span>Battle</span>
            <small>of</small>
            <span>Creations</span>
          </h1>
          <p>Card Battle Game</p>
        </section>

        <nav class="home-actions" aria-label="Game actions">
          <button class="home-tile tile-red" type="button" data-duel-now>
            <img class="tile-img" src="assets/icons/navigation/duel_now_icon.png" alt="" aria-hidden="true">
            <span class="tile-label">Duel Now</span>
            <span class="tile-gem" aria-hidden="true"></span>
          </button>

          <a class="home-tile tile-blue" href="cards.html">
            <img class="tile-img" src="assets/icons/navigation/card_creator_icon.png" alt="" aria-hidden="true">
            <span class="tile-label">Card Creator</span>
            <span class="tile-gem" aria-hidden="true"></span>
          </a>

          <a class="home-tile tile-green" href="decks.html">
            <img class="tile-img" src="assets/icons/navigation/deck_constructor_icon.png" alt="" aria-hidden="true">
            <span class="tile-label">Deck Constructor</span>
            <span class="tile-gem" aria-hidden="true"></span>
          </a>

          <a class="home-tile tile-purple" href="home.html#leaderboards">
            <img class="tile-img" src="assets/icons/navigation/leaderboard_icon.png" alt="" aria-hidden="true">
            <span class="tile-label">Leaderboards</span>
            <span class="tile-gem" aria-hidden="true"></span>
          </a>

          <a class="home-tile tile-gold" href="home.html#rewards">
            <img class="tile-img" src="assets/icons/navigation/rewards_icon.png" alt="" aria-hidden="true">
            <span class="tile-label">Rewards</span>
            <span class="tile-gem" aria-hidden="true"></span>
          </a>

          <a class="home-tile tile-iron" href="index.html" data-logout>
            <img class="tile-img" src="assets/icons/navigation/logout_icon.png" alt="" aria-hidden="true">
            <span class="tile-label">Logout</span>
            <span class="tile-gem" aria-hidden="true"></span>
          </a>
        </nav>

        <div class="home-seal" aria-hidden="true"><span></span></div>
      </div>
    </main>
    <script src="app.js"></script>
  </body>
</html>
