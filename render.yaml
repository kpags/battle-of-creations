services:
  - type: web
    name: battle-of-creations
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: COOKIE_SECURE
        value: "true"
      - key: DATABASE_URL
        fromDatabase:
          name: battle-of-creations-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: keyvalue
          name: battle-of-creations-cache
          property: connectionString
      - key: PG_POOL_MAX
        value: "5"
      - key: MEDIA_DIR
        value: /tmp/battle-of-creations-media

  - type: keyvalue
    name: battle-of-creations-cache
    plan: free
    ipAllowList: []
    maxmemoryPolicy: noeviction

databases:
  - name: battle-of-creations-db
    plan: free
    databaseName: battle_of_creations
    user: boc
    ipAllowList: []
